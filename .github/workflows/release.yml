name: Release

# A pushed v* tag builds every platform through build.yml and attaches the installers
# to a draft release, with the notes from .github/release-notes/<tag>.md. Publishing
# the draft is done by hand. Run by hand with a tag, it does the same for the commit it
# ran on, and GitHub creates the tag when the draft is published.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create on publish, e.g. v0.1.15. Empty builds only."
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    # The Apple signing secrets, when they exist.
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # The app checks the installer it downloads against this list before running it.
      - name: Checksums
        run: |
          cd installers
          find . -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -exec sh -c 'cd "$(dirname "$1")" && sha256sum "$(basename "$1")"' _ {} \; > SHA256SUMS
          cat SHA256SUMS

      # Notes for a tag live in the repository at .github/release-notes/<tag>.md, so
      # they are reviewed with the change. A tag without a file gets an empty body.
      - uses: actions/checkout@v4
        with:
          path: source
          sparse-checkout: .github/release-notes
      - name: Release notes
        id: notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "name=Lathe ${TAG#v}" >> "$GITHUB_OUTPUT"
          notes="source/.github/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then cp "$notes" notes.md; else : > notes.md; fi
          cat notes.md

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.notes.outputs.name }}
          body_path: notes.md
          # The Linux artifact keeps its deb/ and appimage/ folders, hence the **.
          files: |
            installers/**/*-setup.exe
            installers/**/*.dmg
            installers/**/*.deb
            installers/**/*.AppImage
            installers/SHA256SUMS
