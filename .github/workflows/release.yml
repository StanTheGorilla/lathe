name: Release

# A pushed v* tag builds every platform through build.yml and attaches the installers
# to a draft release. Publishing the draft, with notes, is done by hand.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # The Linux artifact keeps its deb/ and appimage/ folders, hence the **.
          files: |
            installers/**/*-setup.exe
            installers/**/*.dmg
            installers/**/*.deb
            installers/**/*.AppImage
