name: Release

# A pushed v* tag builds every platform through build.yml and attaches the installers
# to a draft release. Publishing the draft, with notes, is done by hand.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    # The Apple signing secrets, when they exist.
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # The app checks the installer it downloads against this list before running it.
      - name: Checksums
        run: |
          cd installers
          find . -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -exec sh -c 'cd "$(dirname "$1")" && sha256sum "$(basename "$1")"' _ {} \; > SHA256SUMS
          cat SHA256SUMS

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # The Linux artifact keeps its deb/ and appimage/ folders, hence the **.
          files: |
            installers/**/*-setup.exe
            installers/**/*.dmg
            installers/**/*.deb
            installers/**/*.AppImage
            installers/SHA256SUMS
