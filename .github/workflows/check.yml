name: Check

# The cheap checks that run on every push. The native stacks take close to an hour
# across the three platforms (build.yml), so nothing there runs on push; these build the
# settings window alone, and test the text passes that need no model or GPU. Each takes
# about a minute and catches a broken commit in ui/ or crates/text.

on:
  push:
  pull_request:

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui

  text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Vocabulary correction and replacement rules. lathe-core needs the ggml stack
      # before its own tests can build; this crate needs nothing.
      - run: cargo test -p lathe-text
